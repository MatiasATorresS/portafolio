<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle border glow -->
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Logo symbol: <MT /> -->
  <!-- Left bracket < -->
  <path d="M 17 25 L 11 32 L 17 39" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- MT Monogram -->
  <text x="31" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.5">MT</text>

  <!-- Slash and right bracket /> -->
  <path d="M 46 40 L 51 24" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 50 25 L 56 32 L 50 39" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>